[project]
name = "virasatguide-backend"
version = "0.1.0"
description = "Virasat Guide FastAPI backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.8,<1",
    "pymongo>=4.19.0,<5",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1,<2",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "jwt>=1.4.0",
]

[project.scripts]
virasatguide-backend = "virasatguide_backend:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
